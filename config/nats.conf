port: 4222

jetstream {
  store_dir: "/data"
}

websocket {
  port: 8080
  no_tls: true
}

# Per-user subject permissions (Phase 0 hardening).
authorization {
  users = [
    {
      user: "choiros_local_web",
      password: "local_web",
      permissions: {
        publish: []
        subscribe: ["choiros.local.>"]
      }
    },
    {
      user: "choiros_supervisor",
      password: "local_supervisor",
      permissions: {
        publish: ["choiros.>", "$JS.API.>", "$js.>", "_INBOX.>"]
        subscribe: ["choiros.>", "$JS.API.>", "$js.>", "_INBOX.>"]
      }
    }
  ]
}
